<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#020813"/>
    </linearGradient>
    <radialGradient id="cakeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#007BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTier" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="350" r="220" fill="url(#cakeGlow)"/>
  
  <!-- Cake Platter -->
  <ellipse cx="400" cy="480" rx="220" ry="25" fill="#374151" stroke="#00d2ff" stroke-width="2"/>
  <ellipse cx="400" cy="478" rx="210" ry="20" fill="#1f2937"/>
  
  <!-- Bottom Tier -->
  <rect x="230" y="370" width="340" height="90" rx="15" fill="url(#goldTier)" stroke="#007BFF" stroke-width="2"/>
  <line x1="230" y1="410" x2="570" y2="410" stroke="#00d2ff" stroke-width="2" stroke-dasharray="8 8"/>
  
  <!-- Middle Tier -->
  <rect x="280" y="280" width="240" height="90" rx="12" fill="url(#goldTier)" stroke="#8B5CF6" stroke-width="2"/>
  <line x1="280" y1="320" x2="520" y2="320" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 6"/>
  
  <!-- Top Tier -->
  <rect x="330" y="200" width="140" height="80" rx="10" fill="url(#goldTier)" stroke="#00d2ff" stroke-width="2"/>
  
  <!-- Number 22 Topper -->
  <text x="400" y="170" font-family="'Orbitron', sans-serif" font-size="44" font-weight="bold" fill="#00d2ff" text-anchor="middle" filter="drop-shadow(0 0 10px #00d2ff)">22</text>
  
  <!-- Sparkles -->
  <circle cx="260" cy="220" r="4" fill="#fff" filter="drop-shadow(0 0 6px #00d2ff)"/>
  <circle cx="540" cy="240" r="5" fill="#fff" filter="drop-shadow(0 0 6px #8B5CF6)"/>
  <circle cx="390" cy="110" r="4" fill="#fff" filter="drop-shadow(0 0 8px #fff)"/>
  
  <!-- Subtitle -->
  <text x="400" y="540" font-family="'Orbitron', sans-serif" font-size="20" fill="#9ca3af" text-anchor="middle" letter-spacing="3">LEVEL 22 LUXURY MIDNIGHT CAKE</text>
</svg>
